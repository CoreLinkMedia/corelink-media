<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Corelink Media | Member Access</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{margin:0;padding:30px 15px;font-family:Arial,sans-serif;background:#071b33;color:#14243a}
.container{max-width:480px;margin:25px auto;background:white;padding:30px;border-radius:12px}
.logo{text-align:center;font-size:25px;font-weight:bold;color:#071b33;margin-bottom:8px}
.logo span{color:#17c6b2}
.subtitle{text-align:center;color:#64748b;margin-bottom:25px}
.tabs{display:flex;margin-bottom:22px}
.tabs button{width:50%;padding:13px;border:0;background:#eaf0f5;cursor:pointer;font-weight:bold}
.tabs button.active{background:#17c6b2;color:#071b33}
label{display:block;margin:13px 0 6px;font-size:14px;font-weight:bold}
input{width:100%;padding:13px;border:1px solid #ccd7e2;border-radius:6px;font-size:15px}
input:focus{outline:2px solid #17c6b2}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13px;margin:18px 0}
.check input{width:auto;margin-top:3px}
.submit{width:100%;padding:14px;background:#17c6b2;border:0;border-radius:6px;color:#071b33;font-size:16px;font-weight:bold;cursor:pointer;margin-top:12px}
.submit:hover{background:#12aa9a}
.submit:disabled{opacity:.6;cursor:wait}
.message{margin-top:16px;padding:12px;background:#eef4f9;border-radius:6px;font-size:14px;overflow-wrap:anywhere}
.hidden{display:none}
.back{display:block;text-align:center;color:#17a99a;margin-top:22px;text-decoration:none}
</style>
</head>

<body>
<div class="container">
  <div class="logo">CORELINK <span>MEDIA</span></div>
  <p class="subtitle">Grow Together. Earn Through Performance.</p>

  <div class="tabs">
    <button id="registerTab" class="active" type="button">Register</button>
    <button id="loginTab" type="button">Member Login</button>
  </div>

  <form id="registerForm">
    <label>Full Name</label>
    <input id="fullName" type="text" required>

    <label>Email Address</label>
    <input id="regEmail" type="email" required>

    <label>Mobile Number</label>
    <input id="mobile" type="tel" required>

    <label>Telegram Username</label>
    <input id="telegram" type="text" placeholder="@yourusername" required>

    <label>Password</label>
    <input id="regPassword" type="password" minlength="8" required>

    <label>Confirm Password</label>
    <input id="confirmPassword" type="password" minlength="8" required>

    <div class="check">
      <input id="terms" type="checkbox" required>
      <span>I agree to the Corelink Media Terms and Privacy Policy.</span>
    </div>

    <button class="submit" type="submit">Create Member Account</button>
  </form>

  <form id="loginForm" class="hidden">
    <label>Email Address</label>
    <input id="loginEmail" type="email" required>

    <label>Password</label>
    <input id="loginPassword" type="password" required>

    <button class="submit" type="submit">Login to Corelink</button>
  </form>

  <div id="message" class="message hidden" role="status" aria-live="polite"></div>
  <a class="back" href="index.html">← Back to Homepage</a>
</div>

<script>
const SUPABASE_URL = "https://gxdbhavpbzjruhpafqpf.supabase.co";
const SUPABASE_KEY = "sb_publishable_LLiQMeCIIWP_IiQK7Vn7jg_DKUKJAPk";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const el = id => document.getElementById(id);

function showMessage(text) {
  el("message").textContent = text;
  el("message").classList.remove("hidden");
}

function showForm(type) {
  el("registerForm").classList.toggle("hidden", type !== "register");
  el("loginForm").classList.toggle("hidden", type !== "login");
  el("registerTab").classList.toggle("active", type === "register");
  el("loginTab").classList.toggle("active", type === "login");
  el("message").classList.add("hidden");
}

el("registerTab").addEventListener("click", () => showForm("register"));
el("loginTab").addEventListener("click", () => showForm("login"));

el("registerForm").addEventListener("submit", async function(event) {
  event.preventDefault();

  const fullName = el("fullName").value.trim();
  const email = el("regEmail").value.trim();
  const mobile = el("mobile").value.trim();
  const telegram = el("telegram").value.trim();
  const password = el("regPassword").value;
  const confirm = el("confirmPassword").value;

  if (password !== confirm) {
    showMessage("Your passwords do not match.");
    return;
  }

  if (!el("terms").checked) {
    showMessage("Please agree to the terms first.");
    return;
  }

  const button = this.querySelector("button[type=submit]");
  button.disabled = true;
  button.textContent = "Creating account...";

  try {
    const { error } = await db.auth.signUp({
      email,
      password,
      options: {
        data: {
          full_name: fullName,
          mobile_number: mobile,
          telegram_username: telegram
        },
        emailRedirectTo: window.location.origin + "/auth.html"
      }
    });

    if (error) throw error;

    this.reset();
    showMessage("Registration submitted. Check your email for the confirmation link. After confirming, return here and log in.");

  } catch (error) {
    showMessage(error.message);
  } finally {
    button.disabled = false;
    button.textContent = "Create Member Account";
  }
});

el("loginForm").addEventListener("submit", async function(event) {
  event.preventDefault();

  const email = el("loginEmail").value.trim();
  const password = el("loginPassword").value;
  const button = this.querySelector("button[type=submit]");

  button.disabled = true;
  button.textContent = "Logging in...";

  try {
    const { data, error } = await db.auth.signInWithPassword({
      email,
      password
    });

    if (error) throw error;
    if (!data.session) throw new Error("Login session could not be created.");

    showMessage("Login successful. Opening your dashboard...");

    window.location.assign(
      new URL("MemberDashboard.html", window.location.href).href
    );

  } catch (error) {
    showMessage(error.message);
    button.disabled = false;
    button.textContent = "Login to Corelink";
  }
});
</script>
</body>
</html>
