<div class="card">
  <h3>Create Campaign</h3>

  <input id="campaignName" type="text" placeholder="Campaign name">

  <input id="advertiserName" type="text" placeholder="Advertiser name">

  <select id="commissionType">
    <option value="fixed">Fixed CPA</option>
    <option value="percentage">Percentage</option>
    <option value="hybrid">Hybrid</option>
  </select>

  <input id="fixedAmount" type="number" placeholder="Fixed amount (R)">

  <input id="percentageRate" type="number" placeholder="Percentage rate">

  <button id="createCampaignButton" onclick="createCampaign()">
    Create Campaign
  </button>
</div>
